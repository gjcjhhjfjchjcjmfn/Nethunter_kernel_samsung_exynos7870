name: Kernel Builder + Remote Access

on:
  workflow_dispatch:
    inputs:
      run_command:
        description: 'Command to run kramel.sh'
        default: 'kver=1 zipn=Nethunter-gtaxlte-3.18.140 bash kramel.sh img dtb hdr mkzip'
      repack_boot_img:
        description: 'Repack boot.img'
        type: boolean
        default: true

jobs:
  build-and-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 1. تثبيت المتطلبات الأساسية للبناء
      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-aarch64-linux-gnu \
          gcc-aarch64-linux-gnu git libelf-dev libssl-dev make zip python3 python3-pip wget
          
      # 2. إعداد Tailscale للوصول الآمن (اختياري لو استخدمت sshx)
      - name: Setup Tailscale
        if: env.TAILSCALE_AUTHKEY != ''
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=${TAILSCALE_AUTHKEY} --hostname=kernel-builder
          tailscale ip -4

      # 3. تشغيل جلسة التفاعل Remote Shell (sshx.io)
      - name: Start sshx.io Remote Shell
        run: |
          echo ">>> Starting sshx.io session..."
          # تشغيل sshx في الخلفية والحصول على الرابط
          curl -sSf https://sshx.io/get | sh -s run > sshx_log.txt 2>&1 &
          sleep 5
          echo "=== ACCESS URL ==="
          grep -o 'https://sshx.io/s/[^ ]*' sshx_log.txt || echo "Check log for URL"
          echo "=================="

      # 4. تحميل الـ boot.img الخاص بك (الذي رفعته أنت)
      - name: Download Your Original Boot Image
        run: |
          mkdir -p .github/workflows
          wget -O .github/workflows/boot.img https://github.com/${{ github.repository }}/releases/download/V0.0/boot.img || echo "File not found"

      # 5. تشغيل أمر البناء
      - name: Execute Kernel Build
        run: |
          eval "${{ github.event.inputs.run_command }}"

      # 6. التجميع الآمن (Safe Repack)
      - name: Repack boot.img
        if: ${{ github.event.inputs.repack_boot_img == 'true' }}
        run: |
          KERNEL_IMAGE="out/arch/arm64/boot/Image"
          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then KERNEL_IMAGE="out/arch/arm64/boot/Image.gz-dtb"; fi
          
          git clone --depth=1 https://github.com/MrRob0-X/AIK
          chmod -R 777 AIK
          ./AIK/unpackimg.sh .github/workflows/boot.img
          cp -rf $KERNEL_IMAGE AIK/split_img/boot.img-zImage
          ./AIK/repackimg.sh
          mv AIK/image-new.img boot.img

      # 7. رفع النتائج (Artifacts)
      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: built-kernel-and-boot
          path: |
            boot.img
            out/arch/arm64/boot/Image*
            drivers/net/wireless/realtek/rtl8188eus/8188eu.ko

      # 8. البقاء نشطاً للتحكم اليدوي (اختياري)
      - name: Keep Alive for Debugging
        run: |
          echo "Build finished. Staying alive for manual inspection..."
          sleep 14400 # 4 ساعات للتحكم اليدوي عبر الرابط
